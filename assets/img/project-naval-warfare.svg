      <stop offset="1" stop-color="#01060c"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a5677"/>
      <stop offset="0.35" stop-color="#123048"/>
      <stop offset="1" stop-color="#050d14"/>
    </linearGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b759c"/>
      <stop offset="1" stop-color="#0a2133"/>
    </linearGradient>
    <linearGradient id="flash" x1="0" y1="0" x2="1" y2="0">
